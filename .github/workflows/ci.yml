name: CI

on:
  pull_request:
  push:
    branches: [main, anirudh-e2e-setup]

jobs:
  pre_push_review:
    name: pre-push review
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reaplift
          POSTGRES_PASSWORD: reaplift
          POSTGRES_DB: reaplift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reaplift" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://reaplift:reaplift@localhost:5432/reaplift
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @reaplift/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

  # M10 10.1: the image starts under the production compose and answers /healthz with this commit.
  image:
    name: image starts and answers /healthz
    runs-on: ubuntu-latest
    needs: pre_push_review
    env:
      REAPLIFT_VERSION: ${{ github.sha }}
      COMPOSE: docker compose -f infra/compose.prod.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reaplift-bsp:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
      - name: Start the production compose
        run: |
          grep -v '^POSTGRES_PASSWORD=' .env.example > infra/.env
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)" >> infra/.env
          $COMPOSE up -d
      - name: Wait for /healthz to report this commit
        run: |
          ok=0
          for i in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:3000/healthz || true)
            echo "$body"
            if echo "$body" | grep -q "\"version\":\"$REAPLIFT_VERSION\"" && echo "$body" | grep -q '"db":"ok"'; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          test "$(docker inspect -f '{{.State.ExitCode}}' reaplift-migrate-1)" = 0
          for s in api receiver worker scheduler; do
            test "$(docker inspect -f '{{.State.Running}}' reaplift-$s-1)" = true || { echo "$s is not running"; exit 1; }
          done
      - name: Logs
        if: always()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v
