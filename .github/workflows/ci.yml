name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre_push_review:
    name: pre-push review
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reaplift
          POSTGRES_PASSWORD: reaplift
          POSTGRES_DB: reaplift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reaplift" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://reaplift:reaplift@localhost:5432/reaplift
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @reaplift/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    needs: pre_push_review
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reaplift-bsp:ci
