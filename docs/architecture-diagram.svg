<svg width="1400" height="820" viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ReapLift BSP High-Level Component Diagram</title>
  <desc id="desc">A component diagram showing React web panel, API, worker, receiver, scheduler, Postgres database, Meta WhatsApp API, and Object Storage.</desc>

  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 18; }
      .purple { fill: #f3e8ff; stroke: #7c3aed; stroke-width: 2; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .amber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .gray { fill: #e5e7eb; stroke: #4b5563; stroke-width: 2; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 10 8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="52" text-anchor="middle" class="title">ReapLift BSP High-Level Architecture</text>

  <!-- Panel -->
  <rect x="70" y="120" width="210" height="120" class="purple"/>
  <text x="175" y="170" text-anchor="middle" class="label">React Web Panel</text>
  <text x="175" y="200" text-anchor="middle" class="small">Login, dashboard,</text>
  <text x="175" y="222" text-anchor="middle" class="small">campaign UI, reports</text>

  <!-- API -->
  <rect x="420" y="120" width="210" height="120" class="blue"/>
  <text x="525" y="170" text-anchor="middle" class="label">Node API</text>
  <text x="525" y="200" text-anchor="middle" class="small">Auth, clients,</text>
  <text x="525" y="222" text-anchor="middle" class="small">campaigns, wallet</text>

  <!-- Worker -->
  <rect x="770" y="120" width="210" height="120" class="green"/>
  <text x="875" y="170" text-anchor="middle" class="label">Sender Worker</text>
  <text x="875" y="200" text-anchor="middle" class="small">Queue polling,</text>
  <text x="875" y="222" text-anchor="middle" class="small">Meta send calls</text>

  <!-- Receiver -->
  <rect x="770" y="300" width="210" height="120" class="amber"/>
  <text x="875" y="350" text-anchor="middle" class="label">Receiver</text>
  <text x="875" y="380" text-anchor="middle" class="small">Meta webhook</text>
  <text x="875" y="402" text-anchor="middle" class="small">status processing</text>

  <!-- Scheduler -->
  <rect x="420" y="300" width="210" height="120" class="gray"/>
  <text x="525" y="350" text-anchor="middle" class="label">Scheduler</text>
  <text x="525" y="380" text-anchor="middle" class="small">Timers and sync jobs</text>
  <text x="525" y="402" text-anchor="middle" class="small">template / quality</text>

  <!-- DB -->
  <rect x="420" y="510" width="560" height="140" class="gray"/>
  <text x="700" y="560" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="700" y="590" text-anchor="middle" class="small">clients, users, templates, campaign rows, messages, wallet ledger,</text>
  <text x="700" y="612" text-anchor="middle" class="small">delivery and event history</text>

  <!-- Meta -->
  <rect x="1100" y="120" width="210" height="120" class="blue"/>
  <text x="1205" y="170" text-anchor="middle" class="label">Meta WhatsApp API</text>
  <text x="1205" y="200" text-anchor="middle" class="small">Send, template</text>
  <text x="1205" y="222" text-anchor="middle" class="small">status and callback</text>

  <!-- Object Storage -->
  <rect x="1100" y="510" width="210" height="120" class="green"/>
  <text x="1205" y="560" text-anchor="middle" class="label">Object Storage</text>
  <text x="1205" y="590" text-anchor="middle" class="small">uploaded sheets,</text>
  <text x="1205" y="612" text-anchor="middle" class="small">media, backups</text>

  <!-- arrows -->
  <path d="M280 180 H420" class="arrow"/>
  <path d="M630 180 H770" class="arrow"/>
  <path d="M980 180 H1100" class="arrow"/>

  <path d="M525 240 V300" class="arrow dashed"/>
  <path d="M875 240 V300" class="arrow dashed"/>

  <path d="M630 360 H770" class="arrow dashed"/>
  <path d="M525 420 V510" class="arrow"/>
  <path d="M875 420 V510" class="arrow"/>

  <path d="M980 580 H1100" class="arrow dashed"/>

  <!-- Labels -->
  <text x="335" y="165" class="small">HTTPS API</text>
  <text x="680" y="165" class="small">Queue / send</text>
  <text x="1035" y="165" class="small">Meta calls</text>
  <text x="535" y="470" class="small">data</text>
  <text x="885" y="470" class="small">events</text>
  <text x="1030" y="580" class="small">files</text>

  <!-- milestone note -->
  <rect x="70" y="710" width="1260" height="60" class="gray"/>
  <text x="700" y="745" text-anchor="middle" class="label">Milestone view:</text>
  <text x="700" y="770" text-anchor="middle" class="small">M0 = repo + environment, M1 = schema + one message send, M2–M8 = auth, templates, campaigns, wallet, reports, pilot</text>
</svg>
